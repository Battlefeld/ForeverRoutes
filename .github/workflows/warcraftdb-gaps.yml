name: Complete WarcraftDB XP quest source audit

on:
  # The initial push starts a bounded run. Each successful run chains another
  # only while never-scanned IDs remain; no periodic runs after completion.
  push:
    branches: [main]
    paths:
      - '.github/workflows/warcraftdb-gaps.yml'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Quest IDs per bounded workflow run, with commits after every five'
        type: number
        default: 25

permissions:
  contents: write
  actions: write

concurrency:
  group: foreverroutes-warcraftdb-gapfill-checkpoint-v2
  # A fresh code push replaces the older importer immediately.
  # Chained workflow_dispatch runs must not cancel the run that spawned them.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  fill-gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all quest data models offline
        run: python -m unittest discover -s tests -v
      - name: Prepare verified current database from artifacts branch
        shell: bash
        run: |
          mkdir -p .generated
          git fetch -q --no-tags origin '+refs/heads/artifacts:refs/remotes/origin/artifacts'
          git show origin/artifacts:unified/quests-1-30.json > .generated/base.json
          git show origin/artifacts:unified/quality-audit-1-30.json > .generated/audit.json
          if git cat-file -e origin/artifacts:sources/warcraftdb-quest-gaps.json 2>/dev/null; then
            git show origin/artifacts:sources/warcraftdb-quest-gaps.json > .generated/previous-web.json
          fi
          if git cat-file -e origin/artifacts:sources/warcraftdb-verified-xp-20261023.json 2>/dev/null; then
            git show origin/artifacts:sources/warcraftdb-verified-xp-20261023.json > .generated/verified-web.json
          fi
          python - <<'PY'
          import json
          base=json.load(open('.generated/base.json'))
          audit=json.load(open('.generated/audit.json'))
          ids=audit['missing']['quests_without_xp']
          assert len(ids) <= base['stats']['identified_quests']
          print('Verified source quality audit with',len(ids),'outstanding XP quest IDs')
          PY
      - name: Install headless browser for the JavaScript-powered sources
        run: |
          python -m pip install 'playwright>=1.49,<2'
          python -m playwright install --with-deps chromium
      - name: Import XP gaps including explicit 0-XP and repeatable-source fallback

        shell: bash
        env:
          BATCH_SIZE: ${{ github.event_name == 'push' && '25' || inputs.batch_size || '25' }}
        run: |
          set -euo pipefail
          cp .generated/base.json .generated/current-base.json
          remaining="$BATCH_SIZE"
          while [ "$remaining" -gt 0 ]; do
            chunk="$remaining"
            if [ "$chunk" -gt 5 ]; then chunk=5; fi
            python -m foreverroutes.warcraftdb_gaps collect \
              --audit .generated/audit.json \
              --previous .generated/previous-web.json \
              --output .generated/next-web.json \
              --status-output .generated/import-status.json \
              --limit "$chunk" --delay 1.5 --retry-hours 48
            cp .generated/next-web.json .generated/previous-web.json
            scanned="$(python -c 'import json;print(json.load(open(".generated/import-status.json"))["scanned_this_run"])')"
            if [ "$scanned" -eq 0 ]; then echo 'No more unprocessed quest IDs'; break; fi
            python -m foreverroutes.warcraftdb_gaps apply \
              --base .generated/current-base.json \
              --overlay .generated/previous-web.json \
              --output .generated/next-base.json \
              --audit-output .generated/next-audit.json
            if [ -s .generated/verified-web.json ]; then
              python -m foreverroutes.warcraftdb_gaps apply \
                --base .generated/next-base.json \
                --overlay .generated/verified-web.json \
                --output .generated/verified-base.json \
                --audit-output .generated/verified-audit.json
              mv .generated/verified-base.json .generated/next-base.json
              mv .generated/verified-audit.json .generated/next-audit.json
            fi
            mv .generated/next-base.json .generated/current-base.json
            python -m foreverroutes.gap_reports \
              --database .generated/current-base.json \
              --audit .generated/next-audit.json \
              --web .generated/previous-web.json \
              --csv .generated/missing-xp.csv \
              --text .generated/missing-xp.txt
            bash .github/scripts/publish-artifacts.sh \
              .generated/previous-web.json::sources/warcraftdb-quest-gaps.json \
              .generated/current-base.json::unified/quests-1-30.json \
              .generated/next-audit.json::unified/quality-audit-1-30.json \
              .generated/missing-xp.csv::unified/missing-xp-quest-ids-1-30.csv \
              .generated/missing-xp.txt::unified/missing-xp-quest-ids-1-30.txt \
              .generated/import-status.json::sources/warcraftdb-import-status.json
            remaining=$((remaining-scanned))
          done

      - name: Continue automatically until all outstanding quest IDs have been checked
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -s .generated/import-status.json ]; then
            echo 'No import status: refusing to chain an unverified batch'
            exit 1
          fi
          unseen="$(python -c 'import json; print(json.load(open(".generated/import-status.json"))["unscanned_remaining"])')"
          if [ "$unseen" -gt 0 ]; then
            echo "$unseen quest IDs have not been checked. Queuing 25 more in groups of five."
            gh workflow run warcraftdb-gaps.yml --ref main -f batch_size=25
          else
            echo 'Every ID in the outstanding XP audit has now been checked at least once.'
            echo 'Quests with unknown XP remain marked unknown, not fabricated as zero.'
          fi
