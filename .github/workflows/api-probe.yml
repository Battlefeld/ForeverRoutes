name: api-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: sample the ForeverDB API (spells, classes, items, changes)
        env:
          FOREVERDB_API_KEY: ${{ secrets.FOREVERDB_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          key = os.environ['FOREVERDB_API_KEY']
          def get(path):
              req = urllib.request.Request('https://foreverdb.net/api/v1' + path, headers={'X-API-Key': key, 'User-Agent': 'ForeverRoutes-probe'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, json.load(r)
              except Exception as e:
                  return getattr(e, 'code', 0), {'error': str(e)}
          def show(title, path, limit=1800):
              s, d = get(path)
              print('=====', title, path, 'HTTP', s)
              txt = json.dumps(d, ensure_ascii=False)
              print(txt[:limit] + (' ...[%d chars]' % len(txt) if len(txt) > limit else ''))
              time.sleep(2.2)
              return d
          show('meta', '/meta')
          d = show('spells search', '/spells?q=Frostfire&limit=3')
          ids = [x['id'] for x in (d.get('data') or []) if isinstance(x, dict) and 'id' in x]
          if ids:
              show('one spell', '/spells/%s' % ids[0], 2500)
          c = show('class mage', '/classes/mage', 2500)
          show('item sample', '/items?minLevel=20&maxLevel=20&limit=1', 1800)
          show('changes seen', '/changes-seen?limit=2', 1500)
          PY
