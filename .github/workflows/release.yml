name: release

# A push to main that changes what users get (the addon, the routes, the kill profiles, the walk grid and table, the
# RXP fallback) publishes a new bundle, so ForeverCore picks it up the next time it starts. A change of the planner
# alone publishes nothing until its routes are recomputed (or the workflow is started by hand). Data updates publish
# from the update workflow.
on:
  push:
    branches: [main]
    paths:
      - "ForeverRoutes/**"
      - "data/routes/**"
      - "data/profiles/**"
      - "data/fallbacks/**"
      - "data/walks.json.gz"
      - "data/walktable.json.gz"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: checks
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -timeout 30m ./...
          python3 tools/check_refs.py
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --format=%B > /tmp/notes.md
          tools/release.sh /tmp/notes.md
