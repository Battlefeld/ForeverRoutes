name: release

# A push to main that changes what users get (the addon, the routes, the kill profiles, the walk grid and table, the
# RXP fallback) publishes a new bundle, so ForeverCore picks it up the next time it starts. A change of the planner
# alone publishes nothing until its routes are recomputed (or the workflow is started by hand). Data updates publish
# from the update workflow.
on:
  push:
    branches: [main]
    paths:
      - "ForeverRoutes/**"
      # the bundle ships the Windows planner: its code is part of the release too
      - "route/**"
      - "cmd/foreverroutes/**"
      - "dataset/**"
      - "xp/**"
      - "go.mod"
      - "data/routes/**"
      - "data/routes-ext/**"
      - "data/routes-tests/**"
      - "data/profiles/**"
      - "data/fallbacks/**"
      - "data/walks.json.gz"
      - "data/walktable.json.gz"
  workflow_dispatch:
    inputs:
      interim:
        description: Interim release before a recompute (shipped routes may not match the data yet)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: checks
        id: checks
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -timeout 30m -skip 'TestShippedRoutesMatchCurrentModel' ./...
          python3 tools/check_refs.py
          if [ "${{ inputs.interim }}" = "true" ]; then exit 0; fi
          if go test -timeout 30m -run 'TestShippedRoutesMatchCurrentModel' -count=1 ./cmd/foreverroutes > /tmp/shipped.log 2>&1; then exit 0; fi
          # after a data fix the routes wait for their recompute: the update workflow publishes then, not this run
          changed=$(git log -1 --format=%ct -- data/routes-data.json.gz route/model-stamp.txt)
          if [ "$changed" -gt "$(git log -1 --format=%ct -- data/routes data/routes-ext)" ]; then
            echo "::notice::routes wait for the recompute after the data fix; the update workflow publishes"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          grep -E -- '--- FAIL|_test\.go:[0-9]+:' /tmp/shipped.log | head -n 40
          exit 1
      - name: publish
        if: steps.checks.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FR_STALE_OK: ${{ inputs.interim && '1' || '' }}
        run: |
          git log -1 --format=%B > /tmp/notes.md
          tools/release.sh /tmp/notes.md
