name: foreverdb full list

# Reading of the whole ForeverDB quest list (every level, with chains) into data/audits/foreverdb-full.json.gz: the
# chain rules of the blocks planner and the dataset comparisons read it. Started by hand; commits to the branch it runs on.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foreverdb-full
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: read the list
        env:
          FOREVERDB_API_KEY: ${{ secrets.FOREVERDB_API_KEY }}
        run: python3 tools/foreverdb_full.py --out data/audits/foreverdb-full.json.gz
      - name: commit to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/foreverdb-full.json.gz
          git diff --cached --quiet && { echo "unchanged"; exit 0; }
          git commit -q -m "ForeverDB: vollständige Questliste (alle Stufen)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
