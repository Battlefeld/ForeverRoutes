name: Build Level 1-30 Reference Catalog
on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - 'foreverroutes/catalog.py'
      - 'foreverroutes/xp_reference.py'
      - 'foreverroutes/guide_audit.py'
      - 'tests/test_catalog.py'
      - 'tests/test_xp_reference.py'
      - 'tests/test_guide_audit.py'
      - '.github/workflows/catalog.yml'
permissions:
  contents: write
jobs:
  reference-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build pinned source catalog with public ForeverDB observations
        run: python -m foreverroutes.catalog --overlay data/foreverdb_observations.example.json --guide-ids data/validation/guide_quest_id_candidates.json --output .generated/level_1_30_catalog.json
      - name: Validate catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('.generated/level_1_30_catalog.json').read_text())
          stats=data['stats']
          assert data['schema']=='foreverroutes.catalog.1'
          assert stats['quest_count']>2000, stats
          assert stats['npc_hp_reference']>4500, stats
          assert stats['item_quest_objective_count']>500, stats
          assert not data['metadata']['quest_counts_unknown'] is False
          print(json.dumps(stats,indent=2))
          PY
      - name: Save generated reference catalog to artifacts branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          bash .github/scripts/publish-artifacts.sh \
            .generated/level_1_30_catalog.json::catalog/level-1-30.json
