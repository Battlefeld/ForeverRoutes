name: data

# The shipped dataset must come out of the pinned sources (data/sources/lock.json) byte for byte.
on:
  push:
    paths: ["data/**", "dataset/**", "internal/**", "xp/**", "cmd/**", ".github/workflows/data.yml"]
  pull_request:
    paths: ["data/**", "dataset/**", "internal/**", "xp/**", "cmd/**", ".github/workflows/data.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: rebuild from the pinned sources
        run: go run ./cmd/foreverroutes build-data -out /tmp/routes-data.json.gz
      - name: verify ordinary RXP fallback against pinned guide sources
        run: |
          revision="$(python3 -c 'import json; print(json.load(open("data/sources/lock.json"))["rxp"])')"
          python3 tools/import_rxp.py ".cache/rxp-$revision" --check
      - name: compare
        run: |
          if ! cmp -s data/routes-data.json.gz /tmp/routes-data.json.gz; then
            echo "::error::data/routes-data.json.gz does not match a rebuild from data/sources/lock.json; run build-data and commit the result"
            exit 1
          fi
