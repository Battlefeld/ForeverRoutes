name: update

# Checks every data source for a new state. When the dataset changes and every check passes, the new data is pushed
# to main and published as a release (the bundle ForeverCore updates from: dataset, walk grid, routes, kill profiles,
# the Windows planner, with SHA-256s) that ForeverCore downloads. A failed check changes nothing
# and is reported in an issue. ForeverCore starts this workflow when WoW starts; the schedule is the fallback.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when no source changed
        type: boolean
        default: false
      budget:
        description: Search budget per route scenario when the data changed (the routes are recomputed)
        default: 30s
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: download cache (QuestieDB, cmangos, WarcraftDB pages)
        uses: actions/cache@v4
        with:
          path: .cache
          key: sources-${{ github.run_id }}
          restore-keys: sources-

      - name: check sources and rebuild
        id: update
        env:
          FOREVERDB_API_KEY: ${{ secrets.FOREVERDB_API_KEY }}
        run: |
          args="-require-foreverdb -report /tmp/report.md"
          if [ "${{ inputs.force }}" = "true" ]; then args="$args -force"; fi
          go run ./cmd/foreverroutes update $args
          if git diff --quiet -- data; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # the ordinary RXP chapters are part of what the routes are checked against: a new pinned revision rebuilds them
      - name: regenerate the RXP fallback
        if: steps.update.outputs.changed == 'true'
        run: |
          revision="$(python3 -c 'import json; print(json.load(open("data/sources/lock.json"))["rxp"])')"
          # the cached checkout may hold only the guides: then the shipped licence text stays
          license=""
          for f in LICENSE LICENSE.md LICENSE.txt COPYING; do
            if [ -f ".cache/rxp-$revision/$f" ]; then license="--license .cache/rxp-$revision/$f"; break; fi
          done
          python3 tools/import_rxp.py ".cache/rxp-$revision" $license
          python3 tools/import_rxp.py ".cache/rxp-$revision" --check

      # A routes file belongs to the data it was timed with: when the data changed, the shipped routes are recomputed
      # (all 56 contexts, 404 scenarios from the frozen inputs in data/audits/roster-inputs.json.gz) and verified
      # against the final model before the tests below look at them.
      - name: recompute the routes
        if: steps.update.outputs.changed == 'true'
        env:
          GOMAXPROCS: "4"
        run: |
          set -o pipefail
          # the full output goes to a file; on a failure the failing scenarios and their messages are printed
          # (and land in the failure issue), not only the last lines, which are mostly passing scenarios
          failed() { grep -E -- '--- FAIL|_test\.go:[0-9]+:|^panic|timed out' "$1" | head -n 80 | tee -a /tmp/failures.txt; exit 1; }
          FR_ROSTER_REBUILD=/tmp/roster FR_ROSTER_BUDGET="${{ inputs.budget || '30s' }}" \
            go test ./cmd/foreverroutes -run '^TestRebuildRoster$' -parallel 4 -count=1 -timeout 300m -v > /tmp/rebuild.log 2>&1 \
            || failed /tmp/rebuild.log
          tail -n 40 /tmp/rebuild.log
          FR_ROSTER_FINALIZE=/tmp/roster go test ./cmd/foreverroutes -run '^TestFinalizeRosterEvidence$' -count=1 -v > /tmp/finalize.log 2>&1 \
            || failed /tmp/finalize.log
          tail -n 20 /tmp/finalize.log
          python3 tools/apply_roster_review.py /tmp/roster

      - name: keep the roster logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roster-logs
          path: |
            /tmp/rebuild.log
            /tmp/finalize.log
            /tmp/roster
          if-no-files-found: ignore
          retention-days: 14

      - name: checks before publishing
        if: steps.update.outputs.changed == 'true'
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -timeout 25m ./...
          go run ./cmd/foreverroutes build-data -out /tmp/rebuilt.json.gz
          cmp data/routes-data.json.gz /tmp/rebuilt.json.gz

      - name: push to main and publish
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          { echo "Data update $stamp"; echo; cat /tmp/report.md; } > /tmp/message.txt
          git commit -q -F /tmp/message.txt
          git push origin HEAD:main
          tools/release.sh /tmp/report.md

      - name: report a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="The data update failed, main and the published data stay as they were. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -s /tmp/failures.txt ]; then body="$body"$'\n\nFailing checks:\n\n```\n'"$(cat /tmp/failures.txt)"$'\n```'; fi
          if [ -s /tmp/report.md ]; then body="$body"$'\n\n'"$(cat /tmp/report.md)"; fi
          open="$(gh issue list --label data-update --state open --json number --jq '.[0].number')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh label create data-update --color B60205 --description "automatic data update" 2>/dev/null || true
            gh issue create --title "Data update failed" --label data-update --body "$body"
          fi
