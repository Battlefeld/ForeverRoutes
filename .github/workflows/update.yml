name: update

# Checks every data source for a new state. When the dataset changes and every check passes, the new data is pushed
# to main and published as a release (the bundle ForeverCore updates from: dataset, walk grid, routes, kill profiles,
# the Windows planner, with SHA-256s) that ForeverCore downloads. A failed check changes nothing
# and is reported in an issue. ForeverCore starts this workflow when WoW starts; the schedule is the fallback.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when no source changed
        type: boolean
        default: false
      full:
        description: Search every scenario again (default only the ones the change affects; the daily run always searches all)
        type: boolean
        default: false
      budget:
        description: Search budget per route scenario when the data changed (the routes are recomputed)
        default: 30s
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      # the newest main, not the commit that queued the run: a run waits behind the one before it (concurrency), and
      # its routes must build on what that one pushed
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          # Keep generated gzip bytes identical to data.yml and local pinned rebuilds.
          go-version: '1.24.13'
          cache-dependency-path: go.mod
      - name: download cache (QuestieDB, cmangos, WarcraftDB pages)
        uses: actions/cache@v4
        with:
          path: .cache
          key: sources-${{ github.run_id }}
          restore-keys: sources-

      # The kill profiles follow the engine ForeverSim ships: when its engine changed, they are computed again here
      # (all nine or none). A failure keeps the profiles as they were and is noted; it stops nothing.
      - name: kill profiles from the current engine
        id: profiles
        continue-on-error: true
        run: |
          for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler lua5.1 && break; sleep 30; done
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          state="$(tools/kill_profiles.sh)"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" = changed ]; then echo "- kill profiles recomputed from the engine ForeverSim ships" >> /tmp/profiles.md; fi

      - name: check sources and rebuild
        id: update
        env:
          FOREVERDB_API_KEY: ${{ secrets.FOREVERDB_API_KEY }}
        run: |
          args="-require-foreverdb -report /tmp/report.md"
          if [ "${{ inputs.force }}" = "true" ]; then args="$args -force"; fi
          go run ./cmd/foreverroutes update $args
          if [ "${{ steps.profiles.outcome }}" = failure ]; then echo "- kill profiles could not be recomputed; the last ones stay" >> /tmp/report.md; fi
          if [ -s /tmp/profiles.md ]; then cat /tmp/profiles.md >> /tmp/report.md; fi
          # the routes are recomputed when the data changed, when asked to, or when the shipped routes no longer
          # replay under the current model (new kill profiles, a corrected quest)
          changed=false
          git diff --quiet -- data || changed=true
          if [ "${{ inputs.force }}" = "true" ]; then changed=true; fi
          if [ "$changed" = false ] && ! go test ./cmd/foreverroutes -run '^TestShippedRoutesMatchCurrentModel$' -count=1 > /tmp/stale.log 2>&1; then
            changed=true
            echo "- shipped routes no longer replay under the current model; recomputed" >> /tmp/report.md
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # the ordinary RXP chapters are part of what the routes are checked against: a new pinned revision rebuilds them
      - name: regenerate the RXP fallback
        if: steps.update.outputs.changed == 'true'
        run: |
          revision="$(python3 -c 'import json; print(json.load(open("data/sources/lock.json"))["rxp"])')"
          # the cached checkout may hold only the guides: then the shipped licence text stays
          license=""
          for f in LICENSE LICENSE.md LICENSE.txt COPYING; do
            if [ -f ".cache/rxp-$revision/$f" ]; then license="--license .cache/rxp-$revision/$f"; break; fi
          done
          python3 tools/import_rxp.py ".cache/rxp-$revision" $license
          python3 tools/import_rxp.py ".cache/rxp-$revision" --check

      # A routes file belongs to the data it was timed with: when the data changed, the shipped routes are recomputed
      # (all 56 contexts, 404 scenarios from the frozen inputs in data/audits/roster-inputs.json.gz) and verified
      # against the final model before the tests below look at them.
      - name: recompute the routes
        if: steps.update.outputs.changed == 'true'
        env:
          GOMAXPROCS: "4"
        run: |
          set -o pipefail
          # with a focus (data/focus.txt) only the focused routes are kept current: the routes to 20 are not searched
          # again (the focused ones are continued in data/routes-ext below), the others stay as they are
          if grep -v '^#' data/focus.txt 2>/dev/null | grep -q .; then
            echo "- focus $(grep -v '^#' data/focus.txt | tr -s ' \n' ' '): only the routes in data/routes-ext are recomputed" >> /tmp/report.md
            exit 0
          fi
          # the full output goes to a file; on a failure the failing scenarios and their messages are printed
          # (and land in the failure issue), not only the last lines, which are mostly passing scenarios
          failed() { grep -E -- '--- FAIL|_test\.go:[0-9]+:|^panic|timed out' "$1" | head -n 80 | tee -a /tmp/failures.txt; exit 1; }
          # tolerant: a scenario that still fails after its retries is marked, not fatal; the repair step replaces
          # it with a verified route that keeps its options (or stops the update when it cannot, or when too many
          # scenarios need it: then something broke for everyone)
          # started by hand without "full": the scenarios of the last run that still replay to the same time are kept,
          # only the ones the change affects are searched again (minutes instead of hours)
          # data/focus.txt names the characters the update searches (route keys); the others keep their routes while
          # those still replay (resume), so a recompute takes minutes, not hours
          if [ -s data/focus.txt ]; then export FR_ROSTER_FOCUS="$(grep -v '^#' data/focus.txt | tr -s ' \n' ',' | sed 's/^,//;s/,$//')"; fi
          if [ -n "${FR_ROSTER_FOCUS:-}" ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full }}" != "true" ]; }; then
            python3 tools/seed_roster_resume.py /tmp/roster
            export FR_ROSTER_RESUME=1
          fi
          FR_ROSTER_TOLERATE=1 FR_ROSTER_REBUILD=/tmp/roster FR_ROSTER_BUDGET="${{ inputs.budget || '30s' }}" \
            go test ./cmd/foreverroutes -run '^TestRebuildRoster$' -parallel 4 -count=1 -timeout 300m -v > /tmp/rebuild.log 2>&1 \
            || failed /tmp/rebuild.log
          tail -n 40 /tmp/rebuild.log
          FR_ROSTER_REPAIR=/tmp/roster FR_ROSTER_REPAIR_LIMIT=40 go test ./cmd/foreverroutes -run '^TestRepairRosterScenarios$' -count=1 -v > /tmp/repair.log 2>&1 \
            || failed /tmp/repair.log
          if [ -s /tmp/roster/repairs.txt ] && grep -q . /tmp/roster/repairs.txt; then
            { echo; echo "Scenarios replaced by a verified route:"; echo; sed 's/^/- /' /tmp/roster/repairs.txt; } >> /tmp/report.md
          fi
          FR_ROSTER_FINALIZE=/tmp/roster go test ./cmd/foreverroutes -run '^TestFinalizeRosterEvidence$' -count=1 -v > /tmp/finalize.log 2>&1 \
            || failed /tmp/finalize.log
          tail -n 20 /tmp/finalize.log
          python3 tools/apply_roster_review.py /tmp/roster
          python3 tools/audit_quest_objectives.py

      - name: keep the roster logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roster-logs
          path: |
            /tmp/rebuild.log
            /tmp/repair.log
            /tmp/finalize.log
            /tmp/roster
          if-no-files-found: ignore
          retention-days: 14

      # the routes continued past 20 (data/routes-ext): continued again from their new base route, a minute each;
      # only these, the other routes stay at 20
      - name: continue the extended routes
        if: steps.update.outputs.changed == 'true'
        run: |
          for f in data/routes-ext/*.json; do
            [ -e "$f" ] || continue
            key=$(basename "$f" .json)
            target=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['target'])" "$f")
            go run ./cmd/foreverroutes extend -route "data/routes/$key.json" -target "$target" -stages 20s -budget 0 -out "$f"
          done
      - name: checks before publishing
        if: steps.update.outputs.changed == 'true'
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -timeout 25m ./...
          go run ./cmd/foreverroutes build-data -out /tmp/rebuilt.json.gz
          cmp data/routes-data.json.gz /tmp/rebuilt.json.gz

      - name: push to main and publish
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          { echo "Data update $stamp"; echo; cat /tmp/report.md; } > /tmp/message.txt
          git commit -q -F /tmp/message.txt
          # GitHub answers a push with a server error now and then: try again, with the newest main underneath
          for wait in 0 10 30 60 120; do
            sleep "$wait"
            if git push origin HEAD:main; then pushed=1; break; fi
            # main moved meanwhile: rebase onto it; when its routes changed too (another update or a fix), these
            # routes are not the newest any more and are not published (the next run starts from main)
            if ! git pull -q --rebase origin main; then
              git rebase --abort || true
              echo "::warning::main changed the same routes during this run; nothing published, the next run builds on main"
              exit 0
            fi
          done
          [ -n "${pushed:-}" ] || { echo "push failed after retries"; exit 1; }
          tools/release.sh /tmp/report.md

      - name: report a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="The data update failed, main and the published data stay as they were. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -s /tmp/failures.txt ]; then body="$body"$'\n\nFailing checks:\n\n```\n'"$(cat /tmp/failures.txt)"$'\n```'; fi
          if [ -s /tmp/report.md ]; then body="$body"$'\n\n'"$(cat /tmp/report.md)"; fi
          open="$(gh issue list --label data-update --state open --json number --jq '.[0].number')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh label create data-update --color B60205 --description "automatic data update" 2>/dev/null || true
            gh issue create --title "Data update failed" --label data-update --body "$body"
          fi
